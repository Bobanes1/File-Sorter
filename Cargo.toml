[package]
name = "file-sorter"
version = "0.17.0"
edition = "2024"
description = "Automatically sorts downloaded course files into study-program/module folders"
license = "GPL-3.0-or-later"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui-phosphor = "0.14"
log = "0.4.34"
# Same version pdf-extract uses, so documents can be passed between the two.
lopdf = "0.42"
notify = "8.2.0"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
raw-window-handle = "0.6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sys-locale = "0.3"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "0.1.25"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
tray-icon = { version = "0.26", default-features = false }
# Windows' own text recognition (for scanned PDFs) and its notifications (reminders).
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "UI_Notifications",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
winresource = "0.1"
