name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v0.4). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write  # needed to attach the exe to a release on version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --release

      - name: Build FileSorter.exe
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\file-sorter.exe dist\FileSorter.exe

      - name: Smoke-test the exe (sort once)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force "$root\Downloads" | Out-Null
          Copy-Item tests\fixtures\programming.pptx "$root\Downloads\week1.pptx"
          Copy-Item tests\fixtures\analysis_chromium.pdf "$root\Downloads\vorlesung4.pdf"
          @{
            watch_folder = "$root\Downloads"
            destination_root = "$root\Studium"
            courses = @(
              @{ name = "Programmierung 1"; subject = "Informatik"; keywords = @("programming") },
              @{ name = "Analysis I"; subject = "Mathematik"; keywords = @("analysis i") }
            )
          } | ConvertTo-Json -Depth 5 | Set-Content "$root\config.json"
          $p = Start-Process dist\FileSorter.exe -ArgumentList "--sort-now", "--config", "`"$root\config.json`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          Get-Content "$root\file-sorter.log"
          if (-not (Test-Path "$root\Studium\Informatik\Programmierung 1\week1.pptx")) { throw "PPTX was not sorted" }
          if (-not (Test-Path "$root\Studium\Mathematik\Analysis I\vorlesung4.pdf")) { throw "PDF was not sorted" }
          Write-Host "exe sorted both files correctly"

      - name: Smoke-test removing the "downloaded from the web" mark
        shell: pwsh
        run: |
          $mark = "[ZoneTransfer]`r`nZoneId=3`r`n"
          $pinned = Join-Path $env:APPDATA "Microsoft\Internet Explorer\Quick Launch\User Pinned\TaskBar"
          New-Item -ItemType Directory -Force $pinned | Out-Null
          $lnk = Join-Path $pinned "FileSorter.lnk"
          $other = Join-Path $pinned "SomethingElse.lnk"
          Set-Content $lnk "fake shortcut"; Set-Content $other "other shortcut"
          foreach ($f in @("dist\FileSorter.exe", $lnk, $other)) { Set-Content -Path $f -Stream Zone.Identifier -Value $mark }
          $root = Join-Path $env:RUNNER_TEMP "smoke"
          # -NoNewWindow starts the exe directly. Through Explorer, Windows would first show its
          # "downloaded from the internet" warning, which nobody can click here.
          $p = Start-Process dist\FileSorter.exe -ArgumentList "--sort-now", "--config", "`"$root\config.json`"" -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          if (Get-Item dist\FileSorter.exe -Stream Zone.Identifier -ErrorAction SilentlyContinue) { throw "exe is still marked" }
          if (Get-Item $lnk -Stream Zone.Identifier -ErrorAction SilentlyContinue) { throw "taskbar shortcut is still marked" }
          if (-not (Get-Item $other -Stream Zone.Identifier -ErrorAction SilentlyContinue)) { throw "another program's shortcut was touched" }
          if ((Get-Content $lnk) -ne "fake shortcut") { throw "shortcut content changed" }
          Remove-Item $lnk, $other
          Write-Host "web mark removed from exe and own shortcut only"

      - name: Smoke-test the window (wgpu)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "gui"
          New-Item -ItemType Directory -Force "$root\Downloads", "$root\Studium\Informatik\Programmierung 1", "$root\Studium\Mathematik\Analysis II" | Out-Null
          @{ watch_folder = "$root\Downloads"; destination_root = "$root\Studium" } | ConvertTo-Json | Set-Content "$root\config.json"
          $p = Start-Process dist\FileSorter.exe -ArgumentList "--config", "`"$root\config.json`"" -PassThru
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$env:RUNNER_TEMP\window.png")
          if ($p.HasExited) {
            Get-Content "$root\file-sorter.log" -ErrorAction SilentlyContinue
            throw "the window closed by itself (exit code $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id
          Write-Host "window opened and stayed up"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-screenshot
          path: ${{ runner.temp }}/window.png
          if-no-files-found: ignore

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Real Firefox download test
        run: |
          pip install selenium
          python tests/e2e_firefox.py --exe dist/FileSorter.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FileSorter-windows
          path: dist/FileSorter.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # On a manual run the tag is created on the commit that was just built.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: File Sorter ${{ inputs.release_tag || github.ref_name }}
          files: dist/FileSorter.exe
          body: |
            Download **FileSorter.exe** below and double-click it – nothing else to install.
            Windows SmartScreen may warn because the exe isn't signed: click *More info → Run anyway*.
            See the README for setup and autostart instructions.
