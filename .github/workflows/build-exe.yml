name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the exe to a release on version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build FileSorter.exe
        run: pyinstaller --noconfirm --clean FileSorter.spec

      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force "$root\Downloads" | Out-Null
          python -c "import sys; sys.path.insert(0, 'tests'); from pathlib import Path; from conftest import make_pdf, make_pptx; d = Path(sys.argv[1]); make_pdf(d / 'week1.pdf', 'Intro to Programming'); make_pptx(d / 'slides.pptx', 'Matrix basics')" "$root\Downloads"
          @{
            watch_folder = "$root\Downloads"
            destination_root = "$root\University"
            courses = @(
              @{ name = "Programming Course"; keywords = @("programming") },
              @{ name = "Linear Algebra"; keywords = @("matrix") }
            )
          } | ConvertTo-Json -Depth 5 | Set-Content "$root\config.json"
          $p = Start-Process dist\FileSorter.exe -ArgumentList "--sort-now", "--config", "`"$root\config.json`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          if (-not (Test-Path "$root\University\Programming Course\week1.pdf")) { throw "PDF was not sorted" }
          if (-not (Test-Path "$root\University\Linear Algebra\slides.pptx")) { throw "PPTX was not sorted" }
          Write-Host "exe sorted both files correctly"

      - uses: actions/upload-artifact@v4
        with:
          name: FileSorter-windows
          path: dist/FileSorter.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FileSorter.exe
